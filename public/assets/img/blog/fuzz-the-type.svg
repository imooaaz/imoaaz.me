<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t">
  <title id="t">Fuzz the type: a string id swapped for an object bypasses the check</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151a22"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d232c" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.72" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#e5ac52" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e5ac52" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2029"/>
      <stop offset="1" stop-color="#141820"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e5ac52"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace">
    <!-- request card: before -->
    <g transform="translate(120 170)">
      <rect width="380" height="230" rx="18" fill="url(#card)" stroke="#2a313c"/>
      <circle cx="28" cy="28" r="6" fill="#ff5f57"/><circle cx="48" cy="28" r="6" fill="#febc2e"/><circle cx="68" cy="28" r="6" fill="#28c840"/>
      <text x="300" y="33" fill="#6d7785" font-size="15">POST</text>
      <line x1="0" y1="56" x2="380" y2="56" stroke="#262c36"/>
      <text x="32" y="104" fill="#8b95a3" font-size="24">{</text>
      <text x="58" y="146" fill="#8bb4d4" font-size="26">"id"</text>
      <text x="128" y="146" fill="#8b95a3" font-size="26">:</text>
      <text x="152" y="146" fill="#cfd6df" font-size="26">"123"</text>
      <text x="32" y="188" fill="#8b95a3" font-size="24">}</text>
      <rect x="250" y="122" width="96" height="32" rx="16" fill="#1f2a35" stroke="#2f4a60"/>
      <text x="298" y="144" fill="#8bb4d4" font-size="15" text-anchor="middle">string</text>
    </g>

    <!-- transform arrow -->
    <path d="M520 285 C 580 285, 600 285, 660 285" fill="none" stroke="#e5ac52" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arr)"/>
    <text x="590" y="262" fill="#e5ac52" font-size="15" text-anchor="middle">swap type</text>

    <!-- request card: after -->
    <g transform="translate(680 140)">
      <rect width="420" height="290" rx="18" fill="url(#card)" stroke="#6b5530" stroke-width="1.5"/>
      <circle cx="28" cy="28" r="6" fill="#ff5f57"/><circle cx="48" cy="28" r="6" fill="#febc2e"/><circle cx="68" cy="28" r="6" fill="#28c840"/>
      <text x="340" y="33" fill="#6d7785" font-size="15">POST</text>
      <line x1="0" y1="56" x2="420" y2="56" stroke="#262c36"/>
      <text x="32" y="104" fill="#8b95a3" font-size="24">{</text>
      <text x="58" y="146" fill="#8bb4d4" font-size="26">"id"</text>
      <text x="128" y="146" fill="#8b95a3" font-size="26">:</text>
      <text x="152" y="146" fill="#f2c279" font-size="26">{"$ne": null}</text>
      <text x="32" y="188" fill="#8b95a3" font-size="24">}</text>
      <rect x="32" y="218" width="96" height="32" rx="16" fill="#2a2214" stroke="#6b5530"/>
      <text x="80" y="240" fill="#e5ac52" font-size="15" text-anchor="middle">object</text>
      <rect x="140" y="218" width="78" height="32" rx="16" fill="#1a1e25" stroke="#2a313c"/>
      <text x="179" y="240" fill="#8b95a3" font-size="15" text-anchor="middle">array</text>
      <rect x="230" y="218" width="70" height="32" rx="16" fill="#1a1e25" stroke="#2a313c"/>
      <text x="265" y="240" fill="#8b95a3" font-size="15" text-anchor="middle">bool</text>
    </g>

    <!-- result badge -->
    <g transform="translate(860 470)">
      <rect width="240" height="56" rx="28" fill="#10261a" stroke="#1f6b3d"/>
      <circle cx="30" cy="28" r="8" fill="#4ade80"/>
      <text x="50" y="35" fill="#4ade80" font-size="19">200 OK · authz skipped</text>
    </g>

    <!-- open padlock -->
    <g transform="translate(150 450)" fill="none" stroke="#e5ac52" stroke-width="5" stroke-linecap="round">
      <path d="M22 34 V18 a22 22 0 0 1 42 -8"/>
      <rect x="6" y="34" width="56" height="44" rx="9" fill="#1b2029"/>
      <circle cx="34" cy="54" r="5" fill="#e5ac52" stroke="none"/>
    </g>
    <text x="230" y="495" fill="#6d7785" font-size="16">validate the value, enforce the type</text>
  </g>
</svg>
