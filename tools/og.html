<!doctype html>
<!-- Social preview card (1200x630). Render to assets/img/og.png with:
     msedge --headless --disable-gpu --hide-scrollbars --window-size=1200,630 --virtual-time-budget=6000 --screenshot=assets/img/og.png tools/og.html -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: radial-gradient(900px 500px at 85% 10%, rgba(217, 119, 6, 0.10), transparent 60%),
                radial-gradient(700px 500px at 0% 100%, rgba(42, 101, 146, 0.08), transparent 60%),
                #f6f7f9;
    font-family: Inter, system-ui, sans-serif;
    color: #0f1a2b;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(15,23,42,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(15,23,42,.05) 1px, transparent 1px);
    background-size: 60px 60px;
    -webkit-mask-image: radial-gradient(90% 90% at 60% 40%, #000 40%, transparent 90%);
  }
  .icons { position: absolute; inset: 0; opacity: .3; }
  .wrap { position: absolute; inset: 0; display: flex; align-items: center; gap: 64px; padding: 0 84px; }
  .shield { position: relative; flex: none; width: 300px; height: 342px; filter: drop-shadow(0 24px 40px rgba(15,23,42,.18)); }
  .shield svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .photo { position: absolute; left: 11.43%; top: 6.25%; width: 77.14%; height: 82.5%; clip-path: url(#clip); overflow: hidden; background: #e9edf2; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 45% 10%; transform: scale(1.9); transform-origin: 45% 24%; }
  .dot { position: absolute; right: 26px; bottom: 38px; width: 34px; height: 34px; border-radius: 50%; background: #16a34a; border: 6px solid #f6f7f9; box-shadow: 0 0 0 8px rgba(21,128,61,.15); }
  .kicker { font: 500 24px/1.4 "JetBrains Mono", monospace; color: #b45309; letter-spacing: .01em; }
  h1 { margin: 14px 0 18px; font-size: 92px; line-height: 1; font-weight: 700; letter-spacing: -0.045em;
       background: linear-gradient(180deg, #0f1a2b 40%, #3d4f68); -webkit-background-clip: text; color: transparent; }
  .line { font-size: 28px; line-height: 1.45; color: #3d4756; max-width: 640px; }
  .chips { display: flex; gap: 12px; margin-top: 32px; }
  .chip { font: 500 20px/1 "JetBrains Mono", monospace; padding: 10px 16px; border-radius: 10px; border: 1px solid #dfe3e9; background: #ffffff; color: #3d4756; }
  .chip.hl { color: #b45309; border-color: #f1d3a8; background: #fff7ed; }
  .url { position: absolute; right: 84px; bottom: 44px; font: 500 22px/1 "JetBrains Mono", monospace; color: #6a7484; }
  .url b { color: #b45309; font-weight: 500; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: linear-gradient(180deg, #d97706, #b45309 50%, #2a6592); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="bar"></div>
  <svg class="icons" viewBox="0 0 1200 630" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4">
    <g transform="translate(1080 70)" stroke="#e5ac52"><path d="M24 2 5 9v13c0 11 8 20 19 24 11-4 19-13 19-24V9z"/><path d="m15 24 6 6 12-13"/></g>
    <g transform="translate(980 500)" stroke="#ff8a84"><ellipse cx="22" cy="26" rx="10" ry="14"/><circle cx="22" cy="9" r="5"/><path d="M12 20H4M12 28H3M32 20h8M32 28h9M22 14v26"/></g>
    <g transform="translate(560 40)" stroke="#8bb4d4"><rect x="6" y="20" width="32" height="24" rx="5"/><path d="M13 20v-6a9 9 0 0 1 18 0v6"/></g>
    <g transform="translate(40 520)" stroke="#8bb4d4"><circle cx="10" cy="8" r="5"/><circle cx="10" cy="44" r="5"/><circle cx="36" cy="18" r="5"/><path d="M10 13v26M36 23c0 10-10 10-22 16"/></g>
    <g transform="translate(1110 300)" stroke="#e5ac52"><circle cx="24" cy="24" r="18"/><circle cx="24" cy="24" r="9"/><path d="M24 0v10M24 38v10M0 24h10M38 24h10"/></g>
  </svg>

  <div class="wrap">
    <div class="shield">
      <svg viewBox="0 0 140 160" aria-hidden="true">
        <defs>
          <clipPath id="clip" clipPathUnits="objectBoundingBox"><path d="M.5 0 L1 .15 V.5 C1 .76 .8 .93 .5 1 C.2 .93 0 .76 0 .5 V.15 Z"/></clipPath>
          <linearGradient id="st" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa6b5"/><stop offset=".5" stop-color="#e8edf3"/><stop offset="1" stop-color="#8592a2"/></linearGradient>
          <linearGradient id="ol" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2c279"/><stop offset=".55" stop-color="#e5ac52"/><stop offset="1" stop-color="#8bb4d4"/></linearGradient>
        </defs>
        <g transform="translate(70 80) rotate(-38)"><path d="M0 -112 L6 -99 V56 H-6 V-99 Z" fill="url(#st)"/><rect x="-18" y="56" width="36" height="7" rx="3.5" fill="#e5ac52"/><rect x="-3.2" y="63" width="6.4" height="19" rx="2.4" fill="#6b5530"/><circle cy="86" r="5.5" fill="#e5ac52"/><circle cy="-106" r="3.4" fill="#ff6961"/></g>
        <g transform="translate(70 80) rotate(38)"><path d="M0 -112 L6 -99 V56 H-6 V-99 Z" fill="url(#st)"/><rect x="-18" y="56" width="36" height="7" rx="3.5" fill="#e5ac52"/><rect x="-3.2" y="63" width="6.4" height="19" rx="2.4" fill="#6b5530"/><circle cy="86" r="5.5" fill="#e5ac52"/><circle cy="-106" r="3.4" fill="#ff6961"/></g>
      </svg>
      <div class="photo"><img src="../assets/img/moaaz.jpg" alt=""></div>
      <svg viewBox="0 0 140 160" aria-hidden="true">
        <circle cx="70" cy="76" r="68" fill="none" stroke="#8bb4d4" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 7"/>
        <path d="M70 2v10M70 140v10M0 76h10M130 76h10" stroke="#ff8a84" stroke-width="2" stroke-linecap="round"/>
        <path d="M70 10 L124 29.8 V76 C124 110.3 102.4 132.8 70 142 C37.6 132.8 16 110.3 16 76 V29.8 Z" fill="none" stroke="url(#ol)" stroke-width="3" stroke-linejoin="round"/>
      </svg>
      <span class="dot"></span>
    </div>

    <div>
      <p class="kicker">Cyber &amp; Product Security Engineer<br>Co&#8209;Founder at Raqyan</p>
      <h1>Moaaz Afifi</h1>
      <p class="line">I secure products end to end, from code to the pipeline that ships them.</p>
      <div class="chips">
        <span class="chip hl">CVE-2024-36436</span>
        <span class="chip">DevSecOps</span>
        <span class="chip">Pentesting</span>
        <span class="chip">AppSec</span>
      </div>
    </div>
  </div>
  <p class="url"><b>›</b> imoaaz.pages.dev</p>
</body>
</html>
